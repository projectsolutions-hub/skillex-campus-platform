<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SkillEx</title>

<style>

.sp{flex:1}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px)}

nav a{padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:500;display:flex;gap:8px;align-items:center}nav a:hover{background:var(--soft);color:var(--ink)}nav a.on{background:var(--soft);color:var(--pri);font-weight:700}

main{padding:22px;max-width:1150px;width:100%;margin:0 auto;animation:in .25s}@keyframes in{from{opacity:.4}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}

.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font:700 14px Figtree;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}.btn.p{background:var(--pri);color:var(--on);border-color:var(--pri)}.btn.p:hover{opacity:.9}.btn.d{color:var(--bad)}.btn.s{padding:5px 10px;font-size:13px}

.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:500}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.b.ok{color:var(--ok)}.b.warn{color:var(--warn)}.b.bad{color:var(--bad)}.b.pri{color:var(--pri)}.b.mut{color:var(--mut)}
.ver{color:var(--ok);font-weight:700;font-size:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#141A33;flex:none}
.pc{border-left:5px solid var(--c,var(--pri));cursor:pointer;transition:transform .15s,box-shadow .15s}.pc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,26,51,.12)}
.match{font:800 20px 'Bricolage Grotesque';color:var(--ok)}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}label{font-weight:700;font-size:13px;display:block;margin:10px 0 4px}
.hero{padding:36px 0 10px}.hl{background:linear-gradient(transparent 62%,var(--hl) 62%)}
.step{display:flex;gap:4px;overflow:auto;padding-bottom:6px}.step span{white-space:nowrap;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mut)}.step .done{background:var(--pri);color:var(--on)}.step .cur{outline:2px solid var(--hl);color:var(--ink);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}.tabs a{padding:8px 14px;color:var(--mut);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}.tabs a.on{color:var(--pri);border-color:var(--pri)}

.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200%;animation:sh 1.2s infinite;margin:8px 0}@keyframes sh{to{background-position:-200%}}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:380px}dialog::backdrop{background:rgba(10,12,30,.5);cursor:pointer}
.empty{text-align:center;padding:26px;color:var(--mut);border:2px dashed var(--line);border-radius:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}nav small{display:none}nav a{white-space:nowrap}.two{grid-template-columns:1fr}main{padding:14px}}

.mq{overflow:hidden;border-block:1px solid var(--line);padding:12px 0;margin:30px 0 0}.mq div{display:flex;gap:10px;width:max-content;animation:mq 30s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.sec{margin:52px 0 16px}.sec p{max-width:560px}.top{border-top:5px solid var(--c,var(--pri))}
.band{background:var(--pri);color:var(--on);border-radius:22px;padding:38px 22px;text-align:center;margin-top:52px}.band .btn{border:0}.band .w{background:var(--hl);color:#141A33}.band .o{background:transparent;color:var(--on);border:2px solid var(--on)}

.admin-nav a:hover{background:#1e293b;color:#f8fafc}.admin-nav a.on{background:#1e3a8a;color:#bfdbfe;font-weight:700}

function dismissOnBackdrop(d){if(!d)return;d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)d.close()})}
dismissOnBackdrop(pal);dismissOnBackdrop(dlg);

function pl(){const q=$('#ci').value.toLowerCase(),it=NAV[role].filter(n=>n[2].toLowerCase().includes(q));$('#cl').innerHTML=it.map(n=>`<a class="row" style="padding:9px;color:var(--ink);border-radius:8px" href="#/${n[0]}" onclick="pal.close()">${n[1]} ${n[2]}</a>`).join('')||'<div class="empty">Nothing found</div>'}

else if(currentUser&&currentUser.role=='student'){$('#app').innerHTML=`<header><a class="logo" href="#/dash">Skill<i>Ex</i></a><span class="sp"></span><button class="btn s" onclick="openPal()" aria-label="Search">⌕ Ctrl K</button><a class="btn s" href="#/notifications" aria-label="Notifications">🔔 ${NT.filter(n=>n[2]).length}</a><span class="row" style="padding:4px 10px;border-radius:10px;background:var(--soft);margin:0 4px">${av(currentUser.name,1)} <b>${currentUser.name}</b> <span class="ver">✔</span></span><button class="btn s" onclick="theme=(document.documentElement.dataset.theme=='dark'?'light':'dark');document.documentElement.dataset.theme=theme">◐</button><button class="btn s d" onclick="doLogout()">Log out</button></header><div class="layout"><nav>${NAV.student.map(n=>`<a href="#/${n[0]}" class="${r==n[0]||(n[0]=='discover'&&r=='project')?'on':''}"><span>${n[1]}</span>${n[2]}</a>`).join('')}<small>Private files · Verified campus only</small></nav><main>${body}</main></div>`}
else{$('#app').innerHTML=`<header><a class="logo" href="#/">Skill<i>Ex</i></a><span class="sp"></span><a class="btn s" href="#/auth/login" onclick="loginPortal='student'">Student Login</a><a class="btn s" style="background:#0f172a;color:#f8fafc;border-color:#1e293b" href="#/auth/login" onclick="loginPortal='admin'">Admin Portal</a><a class="btn s p" href="#/auth/register">Join Campus</a><button class="btn s" onclick="theme=(document.documentElement.dataset.theme=='dark'?'light':'dark');document.documentElement.dataset.theme=theme">◐</button></header><main>${body}</main>`}
